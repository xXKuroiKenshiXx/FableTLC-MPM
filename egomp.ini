# EgoMP - configuracion
#
# [keys] Formato: tecla=LETRA | digito | F1-F24 | nombre
#        Nombres validos: SPACE ENTER TAB ESC SHIFT CTRL ALT
#                        UP DOWN LEFT RIGHT HOME END PGUP PGDN INS DEL BACK
#                        NUMPAD0..NUMPAD9
# IMPORTANTE: usa teclas que NO uses durante el juego (NUMPAD recomendado).
[keys]
host=LEFT
connect=RIGHT
disconnect=DOWN

# [network] IP/puerto usados al pulsar Host/Connect.
#           Editar aqui ANTES de lanzar el juego: no se pide por
#           consola (evita congelar el juego en pantalla completa).
# hostIP   = IP del host al que conectarse (Connect). Para Host se ignora.
# hostPort = puerto usado tanto para Host como para Connect.
[network]
hostIP=26.183.1.11
hostPort=60000
